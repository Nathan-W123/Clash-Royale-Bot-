# Full roster as of 2026-07-09 — 108 cards (plus heroes.yaml + evolutions).
# All card stats. Single source of truth for balance — tune here, not in code.
# Scale: level-1 (base) Clash Royale values — the same table configs/arena.yaml's
#   towers come from. Troops all scale on one per-level curve, so level-1 values
#   preserve every real breakpoint; there is nothing to rescale.
#   NOTE: only part of this file is actually sourced. Run
#   `python -m scripts.sync_card_stats` for the per-card diff against the real
#   table (configs/reference_card_stats.json), and see docs/SIM_FIDELITY.md.
# Sections: Common → Rare → Epic → Legendary (log alias: the_log in load_cards).
# speed in tiles/sec, range/radius in tiles, hit_speed/delays in seconds.
# targets: ground | air | both | buildings_only
#
# deploy_time: seconds after placement before the card can act (default 1.0,
#   see constants.DEFAULT_DEPLOY_TIME). Only cards that differ from the
#   default set it explicitly below. The values here are approximations of
#   the real game's deploy/wind-up feel, not exact datamined figures — tune
#   them here rather than in code.

