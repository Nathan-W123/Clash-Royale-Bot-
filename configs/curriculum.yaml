# Curriculum stages. Restrictions are applied via action masking and engine flags,
# never by reshaping obs/action spaces, so checkpoints transfer across stages.
stages:
  - name: one_lane
    deck: stage0
    opponent_deck: stage0
    single_lane: right
    match_time: 90.0
    opponents: [rusher, control]   # UC-tier scripted bots only
    selfplay: false
    promote:
      vs: rusher
      win_rate: 0.80
      matches: 200

  - name: full_arena
    deck: training_mirror
    opponent_deck: training_mirror
    single_lane: null
    match_time: null
    opponents: [rusher, control, siege, beatdown]
    selfplay: true
    promote:
      vs: control
      win_rate: 0.65
      matches: 200

  - name: full_pool
    agent_deck_pool: ladder_top50
    opponent_deck_pool: ladder_top50
    single_lane: null
    match_time: null
    opponents: [rusher, control, siege, beatdown]
    selfplay: true
    promote: null

  # Beat one ladder deck at a time (FocusedRotationManager) while the agent's
  # own deck is rebuilt from per-card scores (AdaptiveDeckBuilder), instead of
  # sampling both decks independently every episode.
  - name: focused_ladder
    opponent_deck_pool: ladder_top50
    single_lane: null
    match_time: null
    opponents: [champion]
    selfplay: false
    focused_rotation: true
    promote: null

  # Deployment stage: train the deck you will actually play live.
  #
  # `deck` pins the agent's side; `opponent_deck_pool` keeps the opposition
  # sampling the whole ladder meta. That asymmetry is the point — you equip
  # one deck in the real game, so specializing on it is a far easier problem
  # than generalizing over seventy, but fixing *both* sides would overfit to
  # a single matchup and teach nothing about the field.
  #
  # Edit `my_deck` in configs/decks.yaml to match your in-game loadout, and
  # set configs/card_levels.yaml to your real card levels, before running it.
  - name: my_deck
    deck: my_deck
    opponent_deck_pool: ladder_top50
    single_lane: null
    match_time: null
    opponents: [rusher, control, siege, beatdown]
    selfplay: true
    promote: null
