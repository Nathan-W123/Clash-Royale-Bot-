# Complete roster (March 2026 meta):
#   Hero troops (12): hero_balloon, hero_barbarian_barrel, hero_giant, hero_goblins,
#     hero_ice_golem, hero_knight, hero_magic_archer, hero_mega_minion,
#     hero_mini_pekka, hero_musketeer, hero_tombstone, hero_wizard
