[project]
name = "cr-bot"
version = "0.1.0"
description = "Clash Royale battle simulator + self-play RL agent (simulator phase)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "gymnasium>=0.29",
    "torch>=2.2",
    "matplotlib>=3.8",
    "tensorboard>=2.16",
    "pillow>=10.0",
    # Windows is spawn-only, so subprocess workers receive their env factories
    # by pickle; the closures in train.py need cloudpickle, not stdlib pickle.
    "cloudpickle>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Subprocess-spawn tests pay real process-startup cost on Windows.
    # Deselect with: pytest -m "not slow"
    "slow: spawns worker processes or otherwise takes seconds",
]
